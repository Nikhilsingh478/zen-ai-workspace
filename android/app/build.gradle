apply plugin: 'com.android.application'
// kotlin-android: enables Kotlin compilation for this module.
// Required because JarvisService.kt, JarvisPlugin.kt, JarvisTtsHelper.kt, and
// BatteryOptimizationHelper.kt are Kotlin source files.
apply plugin: 'kotlin-android'

android {
    namespace "com.aimatrix.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aimatrix.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        // Only ship the two most-common ABI slices to keep APK size reasonable.
        // The sherpa-onnx AAR contains arm64-v8a, armeabi-v7a, x86, and x86_64.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Explicitly pin the Kotlin JVM target to 17.
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
        // Prevent duplicate .so files when the sherpa-onnx AAR and other
        // dependencies ship the same JNI libraries.
        jniLibs {
            pickFirsts += ['**/*.so']
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // Kotlin stdlib
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    // Coroutines — used by JarvisTtsHelper for async synthesis
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    // LocalBroadcastManager — used by JarvisService ↔ JarvisPlugin communication
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
